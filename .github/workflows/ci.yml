name: Quality checks
on:
  push:
    branches: [main, pre, "feature/**"]
  pull_request:
    branches: [pre, main]
permissions:
  contents: read
concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    name: Build and test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: inkastarna_test
          POSTGRES_PASSWORD: ci_disposable_database
          POSTGRES_DB: inkastarna_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://inkastarna_test:ci_disposable_database@localhost:5432/inkastarna_test
      BETTER_AUTH_SECRET: ci-only-secret-for-disposable-test-environment-123456789
      BETTER_AUTH_URL: http://localhost:3100
      TEAM_JOIN_CODE: ci-only-team-code
      ADMIN_JOIN_CODE: ci-only-admin-code
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 5
