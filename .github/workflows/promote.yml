name: Prepare production release
on:
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: write
jobs:
  release-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Open release PR for manual approval
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_REF" = refs/heads/main
          existing=$(gh pr list --repo "$GITHUB_REPOSITORY" --base main --head pre --state open --json url --jq '.[0].url // empty')
          if [ -n "$existing" ]; then echo "$existing" >> "$GITHUB_STEP_SUMMARY"; exit 0; fi
          gh pr create --repo "$GITHUB_REPOSITORY" --base main --head pre --title 'Release: pre → main' --body 'Testa förhandsversionen och granska alla kontroller. Merge till main kräver lagägarens uttryckliga klartecken och publicerar produktion. Detta workflow skapar enbart PR:en.' >> "$GITHUB_STEP_SUMMARY"
