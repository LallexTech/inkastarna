name = "inkastarna-arena"
main = "src/index.js"
compatibility_date = "2026-11-08"

[[durable_objects.bindings]]
name = "GAME_ROOMS"
class_name = "GameRoom"

[[durable_objects.bindings]]
name = "ROOM_DIRECTORY"
class_name = "RoomDirectory"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["GameRoom"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["RoomDirectory"]

[vars]
APP_ORIGINS = "http://localhost:3000,http://localhost:3100,https://pre--inkastarna.netlify.app,https://inkastarna.netlify.app"
